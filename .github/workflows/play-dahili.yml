name: Play dahili test

# Her main birleşmesinde imzalı .aab → Play dahili test kanalı (issue #95,
# ADR-0018 §10 Notlar 2026-11-11). Elle (workflow_dispatch) yalnızca
# main'den çalıştırılır; başka daldan çalıştırılırsa ilk adım anlaşılır bir
# hatayla durur.
#
# İki iş:
#   aab   Derler ve imzalar. Üçüncü taraf kodu (Flutter, Gradle eklentileri)
#         burada çalışır; OIDC token'ı (id-token) alamaz.
#   yukle Yalnızca artefaktı indirir, Workload Identity Federation ile
#         anahtarsız kısa ömürlü bir Google erişim token'ı alır ve
#         tool/play/dahili_yukle.py ile Play Developer API v3'e yükler.
#         id-token: write yalnızca bu iştedir. JSON servis hesabı anahtarı
#         yoktur.
#
# İmza: geliştirme anahtarı Play yükleme anahtarıdır (platform sahibi,
# 2026-11-11). ANDROID_DEV_* secret'ları Gradle'ın TAYFAM_UPLOAD_* ortam
# değişkenlerine verilir; Play App Signing kendi anahtarıyla yeniden imzalar.
#
# Değişkenler (repo ya da play-dahili ortamı; hepsi public değerlerdir):
#   TAYFAM_GOOGLE_SUNUCU_ISTEMCI_PROD  isteğe bağlı; yoksa uygulamadaki varsayılan web istemcisi (uyarıyla).
#   GCP_WIF_SAGLAYICI                  projects/<no>/locations/global/
#                                      workloadIdentityPools/<havuz>/
#                                      providers/<sağlayıcı>
#   GCP_PLAY_SERVIS_HESABI             <ad>@<proje>.iam.gserviceaccount.com
#   PLAY_SURUM_DURUMU                  isteğe bağlı: completed (varsayılan)
#                                      ya da draft (uygulama Play'de hâlâ
#                                      "taslak" ise draft gerekir).
# GCP_* değişkenleri yoksa derleme ve artefakt yine olur; yükleme uyarıyla
# atlanır (ilk .aab Play Console'a elle yüklenir).
#
# versionCode = github.run_number + 100 (taban; pubspec'teki +N ve
# surum.yml'nin etiketli sürümleriyle çakışmasın diye). versionName
# pubspec.yaml'daki X.Y.Z'dir.
#
# Actions commit SHA'sıyla sabittir (CLAUDE.md kesin kural 8). checkout ve
# upload-artifact ci.yml'deki sürümlerdir; download-artifact (GitHub) ve
# google-github-actions/auth (Google) bu iş akışıyla eklendi.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Yalnızca en son main yüklenir; yeni birleşme eski çalışmayı iptal eder.
# Yarıda kesilen yüklemenin edit'i betik tarafından silinir.
concurrency:
  group: play-dahili
  cancel-in-progress: true

env:
  # ci.yml ile aynı Flutter sürümü (ADR-0009).
  FLUTTER_VERSION: 3.47.9
  # Prod API (ADR-0018 §10). Public bir değerdir.
  TAYFAM_API: https://api.tayfam.app
  PAKET: com.murattarslan.tayfam
  SURUM_KODU_TABANI: 100

jobs:
  aab:
    name: aab
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: play-dahili
    outputs:
      surum_kodu: ${{ steps.surum.outputs.surum_kodu }}
      surum_adi: ${{ steps.surum.outputs.surum_adi }}
    steps:
      - name: Yalnızca main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Yalnızca main::Play dahili test iş akışı yalnızca main'den çalışır ('Use workflow from' → main)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sürüm adı ve kodu
        id: surum
        env:
          CALISMA_NO: ${{ github.run_number }}
        run: |
          set -euo pipefail
          surum=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [[ ! "$surum" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$ ]]; then
            echo "::error title=pubspec sürümü::pubspec.yaml version X.Y.Z(+N) biçiminde olmalı."
            exit 1
          fi
          ad="${BASH_REMATCH[1]}"
          kod=$((CALISMA_NO + SURUM_KODU_TABANI))
          echo "Sürüm: $ad, versionCode: $kod"
          {
            echo "surum_adi=$ad"
            echo "surum_kodu=$kod"
          } >> "$GITHUB_OUTPUT"
      - name: Prod Google sunucu istemci kimliği
        id: istemci
        env:
          ISTEMCI: ${{ vars.TAYFAM_GOOGLE_SUNUCU_ISTEMCI_PROD }}
          # Uygulamadaki varsayılan (lib/features/hesap/data/google_kimligi.dart); public.
          VARSAYILAN: 73439258394-uhd9m0b6mkc5k8eaoup6kgh57a49on4t.apps.googleusercontent.com
        run: |
          set -euo pipefail
          if [ -z "$ISTEMCI" ]; then
            echo "::warning title=Değişken yok::TAYFAM_GOOGLE_SUNUCU_ISTEMCI_PROD tanımlı değil; uygulamadaki varsayılan web istemcisi kullanılıyor. Prod API'nin GOOGLE_CLIENT_IDS listesinde olmalı."
            ISTEMCI="$VARSAYILAN"
          fi
          if [[ ! "$ISTEMCI" =~ ^[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error title=Değişken geçersiz::TAYFAM_GOOGLE_SUNUCU_ISTEMCI_PROD <sayı>-<kod>.apps.googleusercontent.com biçiminde değil."
            exit 1
          fi
          echo "Google sunucu istemcisi: $ISTEMCI"
          echo "kimlik=$ISTEMCI" >> "$GITHUB_OUTPUT"
      - name: Yükleme anahtarı (geliştirme anahtarı)
        # Geliştirme anahtarı Play yükleme anahtarıdır (platform sahibi,
        # 2026-11-11). Dört secret da dolu olmalı; yoksa imzasız deneme
        # yapılmaz. Anahtar yalnızca $RUNNER_TEMP'e açılır; parolalar
        # yalnızca derleme adımının ortamındadır (GITHUB_ENV'e yazılmaz).
        env:
          ANAHTAR_B64: ${{ secrets.ANDROID_DEV_KEYSTORE_B64 }}
          PAROLA: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          TAKMA_AD: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          ANAHTAR_PAROLASI: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          eksik=()
          [ -n "$ANAHTAR_B64" ] || eksik+=(ANDROID_DEV_KEYSTORE_B64)
          [ -n "$PAROLA" ] || eksik+=(ANDROID_DEV_KEYSTORE_PASSWORD)
          [ -n "$TAKMA_AD" ] || eksik+=(ANDROID_DEV_KEY_ALIAS)
          [ -n "$ANAHTAR_PAROLASI" ] || eksik+=(ANDROID_DEV_KEY_PASSWORD)
          if [ "${#eksik[@]}" -gt 0 ]; then
            echo "::error title=Yükleme anahtarı yok::Eksik secret: ${eksik[*]}. İmzasız sürüm derlenmez."
            exit 1
          fi
          dosya="$RUNNER_TEMP/tayfam-yukleme.jks"
          umask 077
          if ! printf '%s' "$ANAHTAR_B64" | base64 -d > "$dosya" 2>/dev/null || [ ! -s "$dosya" ]; then
            rm -f "$dosya"
            echo "::error title=Yükleme anahtarı okunamadı::ANDROID_DEV_KEYSTORE_B64 geçerli base64 değil."
            exit 1
          fi
          echo "TAYFAM_UPLOAD_KEYSTORE=$dosya" >> "$GITHUB_ENV"
      - name: Java 17
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Sürüm derlemesi önbelleksiz: başka bir çalışmanın önbelleği
          # imzalı çıktıya karışmasın (surum.yml ile aynı).
          cache: false
      - name: Bağımlılıklar (pubspec.lock'a birebir)
        run: flutter pub get --enforce-lockfile
      - name: İmzalı .aab
        env:
          ISTEMCI: ${{ steps.istemci.outputs.kimlik }}
          SURUM_ADI: ${{ steps.surum.outputs.surum_adi }}
          SURUM_KODU: ${{ steps.surum.outputs.surum_kodu }}
          TAYFAM_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          TAYFAM_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          TAYFAM_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name="$SURUM_ADI" \
            --build-number="$SURUM_KODU" \
            --dart-define=TAYFAM_API="$TAYFAM_API" \
            --dart-define=TAYFAM_GOOGLE_SUNUCU_ISTEMCI="$ISTEMCI" \
            --dart-define=TAYFAM_SURUM="$SURUM_ADI+$SURUM_KODU"
      - name: İmzalı .apk (cihaza doğrudan kurulum)
        # Play dahili test kanalı hazır olana kadar cihaza elle kurmak için
        # (platform sahibi, 2026-11-12): aynı anahtar, aynı prod ayarları,
        # yalnızca arm64-v8a ve armeabi-v7a; ABI başına ayrı ve küçük dosya.
        env:
          ISTEMCI: ${{ steps.istemci.outputs.kimlik }}
          SURUM_ADI: ${{ steps.surum.outputs.surum_adi }}
          SURUM_KODU: ${{ steps.surum.outputs.surum_kodu }}
          TAYFAM_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          TAYFAM_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          TAYFAM_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm \
            --build-name="$SURUM_ADI" \
            --build-number="$SURUM_KODU" \
            --dart-define=TAYFAM_API="$TAYFAM_API" \
            --dart-define=TAYFAM_GOOGLE_SUNUCU_ISTEMCI="$ISTEMCI" \
            --dart-define=TAYFAM_SURUM="$SURUM_ADI+$SURUM_KODU"
          ls -l build/app/outputs/flutter-apk/
      - name: Yükleme anahtarını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/tayfam-yukleme.jks"
      - name: İmza sertifikası parmak izleri
        # Parmak izleri public'tir. Bu yükleme (= geliştirme) anahtarınınkidir;
        # Play App Signing sertifikasınınki Play Console'dadır. Debug
        # sertifikasıyla imzalanmışsa iş kırılır (#13).
        env:
          SURUM_ADI: ${{ steps.surum.outputs.surum_adi }}
          SURUM_KODU: ${{ steps.surum.outputs.surum_kodu }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/sertifika.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/sertifika.txt"; then
            echo "::error title=Debug imzası::.aab debug sertifikasıyla imzalanmış."
            exit 1
          fi
          sha1=$(sed -n 's/^[[:space:]]*SHA1: *//p' "$RUNNER_TEMP/sertifika.txt" | LC_ALL=C sort -u)
          sha256=$(sed -n 's/^[[:space:]]*SHA256: *//p' "$RUNNER_TEMP/sertifika.txt" | LC_ALL=C sort -u)
          [[ "$sha1" =~ ^([0-9A-F]{2}:){19}[0-9A-F]{2}$ ]] || { echo "::error::.aab imzalı değil ya da SHA-1 okunamadı."; exit 1; }
          [[ "$sha256" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]] || { echo "::error::.aab imzalı değil ya da SHA-256 okunamadı."; exit 1; }
          echo "Yükleme sertifikası SHA-1:   $sha1"
          echo "Yükleme sertifikası SHA-256: $sha256"
          {
            echo "## Tayfam $SURUM_ADI ($SURUM_KODU) — dahili test .aab"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`$SURUM_ADI\` |"
            echo "| versionCode | \`$SURUM_KODU\` |"
            echo "| API | \`$TAYFAM_API\` |"
            echo "| Yükleme sertifikası SHA-1 | \`$sha1\` |"
            echo "| Yükleme sertifikası SHA-256 | \`$sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: .aab (artefakt)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tayfam-dahili-${{ steps.surum.outputs.surum_kodu }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: .apk (artefakt)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tayfam-dahili-${{ steps.surum.outputs.surum_kodu }}-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14


  yukle:
    name: yukle
    needs: aab
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: play-dahili
    permissions:
      contents: read
      id-token: write # yalnızca Workload Identity Federation için
    env:
      WIF_SAGLAYICI: ${{ vars.GCP_WIF_SAGLAYICI }}
      SERVIS_HESABI: ${{ vars.GCP_PLAY_SERVIS_HESABI }}
    steps:
      - name: Play kimliği yapılandırıldı mı
        id: kimlik
        run: |
          set -euo pipefail
          eksik=()
          [ -n "$WIF_SAGLAYICI" ] || eksik+=(GCP_WIF_SAGLAYICI)
          [ -n "$SERVIS_HESABI" ] || eksik+=(GCP_PLAY_SERVIS_HESABI)
          if [ "${#eksik[@]}" -gt 0 ]; then
            echo "::warning title=Play yüklemesi atlandı::Eksik değişken: ${eksik[*]}. .aab artefaktta; Play Console'a elle yüklenebilir."
            echo "var=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$WIF_SAGLAYICI" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]; then
            echo "::error title=Değişken geçersiz::GCP_WIF_SAGLAYICI projects/<no>/locations/global/workloadIdentityPools/<havuz>/providers/<sağlayıcı> biçiminde değil."
            exit 1
          fi
          if [[ ! "$SERVIS_HESABI" =~ ^[a-z][a-z0-9-]+@[a-z][a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error title=Değişken geçersiz::GCP_PLAY_SERVIS_HESABI <ad>@<proje>.iam.gserviceaccount.com biçiminde değil."
            exit 1
          fi
          echo "var=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.kimlik.outputs.var == 'true'
        with:
          persist-credentials: false
          sparse-checkout: tool/play
      - name: .aab (artefakt)
        if: steps.kimlik.outputs.var == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tayfam-dahili-${{ needs.aab.outputs.surum_kodu }}-aab
          path: ${{ runner.temp }}/aab
      - name: Google kimliği (Workload Identity Federation)
        id: google
        if: steps.kimlik.outputs.var == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_SAGLAYICI }}
          service_account: ${{ vars.GCP_PLAY_SERVIS_HESABI }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 900s
          # Kimlik dosyası ve ortam değişkeni yazılmaz; token yalnızca
          # yükleme adımına verilir.
          create_credentials_file: false
          export_environment_variables: false
      - name: Sürüm notu
        if: steps.kimlik.outputs.var == 'true'
        # Son commit'in başlığı (Conventional Commits; kişisel veri
        # içermez). Betik tek satıra indirir ve 500 karakterle sınırlar.
        run: |
          set -euo pipefail
          git log -1 --format=%s > "$RUNNER_TEMP/surum-notu.txt"
      - name: Play dahili test kanalına yükle
        if: steps.kimlik.outputs.var == 'true'
        env:
          PLAY_ERISIM_TOKENI: ${{ steps.google.outputs.access_token }}
          SURUM_KODU: ${{ needs.aab.outputs.surum_kodu }}
          DURUM: ${{ vars.PLAY_SURUM_DURUMU || 'completed' }}
        run: |
          set -euo pipefail
          PLAY_SURUM_NOTU="$(cat "$RUNNER_TEMP/surum-notu.txt")" \
            python3 -I tool/play/dahili_yukle.py \
              --paket "$PAKET" \
              --aab "$RUNNER_TEMP/aab/app-release.aab" \
              --surum-kodu "$SURUM_KODU" \
              --durum "$DURUM"
          {
            echo "## Play dahili test"
            echo
            echo "versionCode \`$SURUM_KODU\` dahili test kanalına yüklendi (durum: \`$DURUM\`)."
          } >> "$GITHUB_STEP_SUMMARY"
