name: Yayın (TestFlight)

# ADR-0034 §2. main = prod (ADR-0029): main'e her birleşme — yalnızca
# dev → main sürüm PR'ı — imzalı olarak TestFlight'a gider. dev'e birleşmede
# bu iş akışı çalışmaz. Elle (workflow_dispatch) yalnızca main'den
# çalıştırılır (yarıda kalan bir yüklemeyi tamamlamak için).
#
# Mac ve iOS cihaz yoktur (platform sahibi, 2026-11-24): derleme, imza ve
# yükleme yalnızca burada yapılır. Araçlar yalnızca Xcode'un kendi
# araçlarıdır; fastlane ve üçüncü taraf yükleme Action'ı yoktur.
#
# Üç iş (play-dahili.yml ile aynı ayrım):
#   surum   Sürüm adı ve derleme numarası. Secret yok.
#   arsiv   İmzasız .xcarchive üretir. Üçüncü taraf kodu (Flutter,
#           eklentiler, iOS bağımlılık yöneticisi) burada çalışır; App Store
#           Connect API anahtarını görmez.
#   yukle   Yalnızca arşivi indirir; API anahtarıyla imzalar (Xcode'un
#           otomatik, bulutta yönetilen dağıtım imzası) ve TestFlight'a
#           yükler. Kod indirmez, bağımlılık kurmaz. Anahtar yalnızca bu
#           iştedir ve `testflight` ortamından gelir (ortam yalnızca main'e
#           açıktır).
#
# vX.Y.Z etiketini play-dahili.yml atar; bu iş akışı etiket atmaz.
#
# Sürüm (ADR-0029 §4, ADR-0034 §2):
#   CFBundleShortVersionString  pubspec.yaml'daki X.Y.Z
#   CFBundleVersion             Android versionCode ile aynı sayı: main'in
#                               birinci ebeveyn commit sayısı + 1000.
#
# Secret'lar (`testflight` ortamı):
#   ASC_KEY_ID      App Store Connect API anahtar kimliği (10 karakter)
#   ASC_ISSUER_ID   Issuer ID (UUID)
#   ASC_KEY_P8      .p8 dosyasının içeriği (düz metin, BEGIN/END satırlarıyla)
# Değişkenler (`testflight` ortamı ya da repo; public değerlerdir):
#   APPLE_TEAM_ID                      Apple Developer Team ID (10 karakter)
#   TAYFAM_GOOGLE_SUNUCU_ISTEMCI_PROD  isteğe bağlı; play-dahili.yml ile aynı
# Secret ya da Team ID yoksa arşiv yine üretilir; yükleme uyarıyla atlanır.
#
# Semboller: Dart karartması yoktur (ADR-0034 §3). dSYM dosyaları yüklemeyle
# App Store Connect'e gider ve ayrıca artefakt olarak saklanır.
#
# Actions commit SHA'sıyla sabittir (CLAUDE.md kesin kural 8); sürümler
# ci.yml ve play-dahili.yml'dekilerle aynıdır.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  # ci.yml ile aynı Flutter sürümü (ADR-0009).
  FLUTTER_VERSION: 3.47.9
  # ci.yml'deki ios işiyle aynı Xcode (ADR-0034 §2).
  XCODE_UYGULAMASI: /Applications/Xcode_26.app
  TAYFAM_API: https://api.tayfam.app
  PAKET: com.murattarslan.tayfam
  # play-dahili.yml ile aynı taban; değiştirilmez.
  SURUM_KODU_TABANI: 1000

jobs:
  surum:
    name: surum
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      surum_kodu: ${{ steps.surum.outputs.surum_kodu }}
      surum_adi: ${{ steps.surum.outputs.surum_adi }}
    steps:
      - name: Yalnızca main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Yalnızca main::TestFlight iş akışı yalnızca main'den çalışır ('Use workflow from' → main)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode birinci ebeveyn commit sayısıdır: bütün geçmiş gerekir.
          fetch-depth: 0
          persist-credentials: false
      - name: Sürüm adı ve derleme numarası
        id: surum
        run: |
          set -euo pipefail
          surum=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [[ ! "$surum" =~ ^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(\+[0-9]+)?$ ]]; then
            echo "::error title=pubspec sürümü::pubspec.yaml version X.Y.Z(+N) biçiminde olmalı."
            exit 1
          fi
          ad="${BASH_REMATCH[1]}"
          sayi=$(git rev-list --count --first-parent HEAD)
          kod=$((sayi + SURUM_KODU_TABANI))
          echo "Sürüm: $ad, derleme numarası: $kod"
          {
            echo "surum_adi=$ad"
            echo "surum_kodu=$kod"
          } >> "$GITHUB_OUTPUT"

  arsiv:
    name: arsiv
    needs: surum
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SURUM_ADI: ${{ needs.surum.outputs.surum_adi }}
      SURUM_KODU: ${{ needs.surum.outputs.surum_kodu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode sürümü
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_UYGULAMASI" ]; then
            ls -d /Applications/Xcode*.app
            echo "::error title=Xcode::$XCODE_UYGULAMASI imajda yok; XCODE_UYGULAMASI güncellenmeli."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_UYGULAMASI"
          xcodebuild -version
      - name: Prod Google sunucu istemci kimliği
        id: istemci
        env:
          ISTEMCI: ${{ vars.TAYFAM_GOOGLE_SUNUCU_ISTEMCI_PROD }}
          # play-dahili.yml ile aynı varsayılan; public.
          VARSAYILAN: 73439258394-uhd9m0b6mkc5k8eaoup6kgh57a49on4t.apps.googleusercontent.com
        run: |
          set -euo pipefail
          if [ -z "$ISTEMCI" ]; then
            ISTEMCI="$VARSAYILAN"
          fi
          if [[ ! "$ISTEMCI" =~ ^[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error title=Değişken geçersiz::TAYFAM_GOOGLE_SUNUCU_ISTEMCI_PROD <sayı>-<kod>.apps.googleusercontent.com biçiminde değil."
            exit 1
          fi
          echo "kimlik=$ISTEMCI" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Sürüm derlemesi önbelleksiz (play-dahili.yml ile aynı gerekçe).
          cache: false
      - name: Bağımlılıklar (pubspec.lock'a birebir)
        run: flutter pub get --enforce-lockfile
      - name: İmzasız arşiv
        env:
          ISTEMCI: ${{ steps.istemci.outputs.kimlik }}
        run: |
          set -euo pipefail
          flutter build ipa --release --no-codesign \
            --build-name="$SURUM_ADI" \
            --build-number="$SURUM_KODU" \
            --dart-define=TAYFAM_API="$TAYFAM_API" \
            --dart-define=TAYFAM_GOOGLE_SUNUCU_ISTEMCI="$ISTEMCI" \
            --dart-define=TAYFAM_SURUM="$SURUM_ADI+$SURUM_KODU"
      - name: Arşiv denetimi
        # Yanlış uygulamayı ya da yanlış sürümü yüklememek için arşivin
        # kendi Info.plist'i okunur.
        run: |
          set -euo pipefail
          arsiv=build/ios/archive/Runner.xcarchive
          plist="$arsiv/Products/Applications/Runner.app/Info.plist"
          kimlik=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          ad=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          kod=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          sdk=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$plist")
          echo "Bundle: $kimlik, sürüm: $ad ($kod), SDK: $sdk"
          [ "$kimlik" = "$PAKET" ] || { echo "::error::Bundle kimliği $PAKET değil: $kimlik"; exit 1; }
          [ "$ad" = "$SURUM_ADI" ] || { echo "::error::Sürüm adı $SURUM_ADI değil: $ad"; exit 1; }
          [ "$kod" = "$SURUM_KODU" ] || { echo "::error::Derleme numarası $SURUM_KODU değil: $kod"; exit 1; }
          # Arşivdeki sembolik bağlar (framework'ler) artefaktta bozulmasın
          # diye tar ile paketlenir.
          tar -C build/ios/archive -cf "$RUNNER_TEMP/Runner.xcarchive.tar" Runner.xcarchive
          {
            echo "## Tayfam $SURUM_ADI ($SURUM_KODU) — iOS arşivi"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Sürüm | \`$ad\` |"
            echo "| Derleme numarası | \`$kod\` |"
            echo "| SDK | \`$sdk\` |"
            echo "| API | \`$TAYFAM_API\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Arşiv (artefakt)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tayfam-${{ needs.surum.outputs.surum_kodu }}-xcarchive
          path: ${{ runner.temp }}/Runner.xcarchive.tar
          if-no-files-found: error
          retention-days: 14

  yukle:
    name: yukle
    needs: [surum, arsiv]
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    # Bu iş kod indirmez; yalnızca artefaktı okur.
    permissions: {}
    env:
      SURUM_ADI: ${{ needs.surum.outputs.surum_adi }}
      SURUM_KODU: ${{ needs.surum.outputs.surum_kodu }}
      TAKIM: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: App Store Connect kimliği yapılandırıldı mı
        id: kimlik
        env:
          ANAHTAR_KIMLIGI: ${{ secrets.ASC_KEY_ID }}
          YAYINCI: ${{ secrets.ASC_ISSUER_ID }}
          ANAHTAR: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          eksik=()
          [ -n "$ANAHTAR_KIMLIGI" ] || eksik+=(ASC_KEY_ID)
          [ -n "$YAYINCI" ] || eksik+=(ASC_ISSUER_ID)
          [ -n "$ANAHTAR" ] || eksik+=(ASC_KEY_P8)
          [ -n "$TAKIM" ] || eksik+=(APPLE_TEAM_ID)
          if [ "${#eksik[@]}" -gt 0 ]; then
            echo "::warning title=TestFlight yüklemesi atlandı::Eksik: ${eksik[*]}. Arşiv artefaktta."
            echo "var=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Değerler yazdırılmaz; yalnızca biçim denetlenir.
          [[ "$ANAHTAR_KIMLIGI" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error title=Secret geçersiz::ASC_KEY_ID 10 karakter (A-Z, 0-9) değil."; exit 1; }
          [[ "$YAYINCI" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]] || { echo "::error title=Secret geçersiz::ASC_ISSUER_ID UUID biçiminde değil."; exit 1; }
          [[ "$TAKIM" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error title=Değişken geçersiz::APPLE_TEAM_ID 10 karakter (A-Z, 0-9) değil."; exit 1; }
          ilk=$(printf '%s\n' "$ANAHTAR" | sed -n '1p' | tr -d '\r')
          son=$(printf '%s\n' "$ANAHTAR" | sed '/^[[:space:]]*$/d' | tail -n 1 | tr -d '\r')
          if [ "$ilk" != "-----BEGIN PRIVATE KEY-----" ] || [ "$son" != "-----END PRIVATE KEY-----" ]; then
            echo "::error title=Secret geçersiz::ASC_KEY_P8 .p8 dosyasının tam içeriği değil (BEGIN/END PRIVATE KEY satırları eksik)."
            exit 1
          fi
          echo "var=true" >> "$GITHUB_OUTPUT"
      - name: Xcode sürümü
        if: steps.kimlik.outputs.var == 'true'
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_UYGULAMASI"
          xcodebuild -version
      - name: Arşiv (artefakt)
        if: steps.kimlik.outputs.var == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tayfam-${{ needs.surum.outputs.surum_kodu }}-xcarchive
          path: ${{ runner.temp }}/arsiv
      - name: İmzala ve TestFlight'a yükle
        if: steps.kimlik.outputs.var == 'true'
        # Anahtar yalnızca bu adımın ortamındadır; $RUNNER_TEMP'e açılır ve
        # adım bitince (hata dahil) silinir. İmza: Xcode'un otomatik,
        # bulutta yönetilen dağıtım sertifikası; sertifika ve profil
        # runner'a kalıcı yazılmaz.
        env:
          ANAHTAR_KIMLIGI: ${{ secrets.ASC_KEY_ID }}
          YAYINCI: ${{ secrets.ASC_ISSUER_ID }}
          ANAHTAR: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tar -xf arsiv/Runner.xcarchive.tar
          umask 077
          mkdir -p anahtar
          dosya="$RUNNER_TEMP/anahtar/AuthKey_${ANAHTAR_KIMLIGI}.p8"
          trap 'rm -rf "$RUNNER_TEMP/anahtar"' EXIT
          printf '%s\n' "$ANAHTAR" | tr -d '\r' > "$dosya"
          cat > DisaAktarma.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TAKIM}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath Runner.xcarchive \
            -exportOptionsPlist DisaAktarma.plist \
            -exportPath disa-aktarma \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$dosya" \
            -authenticationKeyID "$ANAHTAR_KIMLIGI" \
            -authenticationKeyIssuerID "$YAYINCI"
          {
            echo "## TestFlight"
            echo
            echo "\`$SURUM_ADI\` (\`$SURUM_KODU\`) App Store Connect'e yüklendi. İşlenmesi bitince TestFlight'ta görünür."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: dSYM paketi
        if: steps.kimlik.outputs.var == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          if [ -d Runner.xcarchive/dSYMs ]; then
            tar -C Runner.xcarchive -cf dsym.tar dSYMs
          fi
      - name: dSYM (artefakt)
        if: steps.kimlik.outputs.var == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tayfam-${{ needs.surum.outputs.surum_kodu }}-dsym
          path: ${{ runner.temp }}/dsym.tar
          if-no-files-found: warn
          # Çökme kayıtları eski sürümlerden de gelir (ADR-0034 §3).
          retention-days: 90
