name: CI

# ADR-0009 (önerildi), issue #9. Tüm Actions commit SHA'sıyla sabitlenmiştir
# (CLAUDE.md kesin kural 8); yorumdaki sürüm yalnızca okunabilirlik içindir.
# pull_request_target ve self-hosted runner kullanılmaz; fork PR'ları secret
# görmez (Tayfam-Api ADR-0010 ile aynı).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Aynı daldaki yeni push eski çalışmayı iptal eder. main'de iptal edilmez:
# main'deki her commit'in kendi sonucu olsun.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  # Flutter sürümü yalnızca burada (ADR-0009). Yükseltme bu satır ve
  # pubspec.lock ile birlikte tek PR'da yapılır.
  FLUTTER_VERSION: 3.47.9

jobs:
  analiz:
    name: analiz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bağımlılıklar (pubspec.lock'a birebir)
        run: flutter pub get --enforce-lockfile
      - name: Çeviri kodu (gen_l10n)
        run: flutter gen-l10n
      - name: Biçim
        # Yalnızca repodaki (elle yazılan) Dart dosyaları; üretilen çeviri
        # kodu .gitignore'da olduğu için listeye girmez.
        run: |
          git ls-files -z -- 'lib/*.dart' 'test/*.dart' 'tool/*.dart' \
            | xargs -0 --no-run-if-empty dart format --output=none --set-exit-if-changed
      - name: Biçim farkı (yalnızca biçim hatasında)
        if: failure()
        run: |
          git ls-files -z -- 'lib/*.dart' 'test/*.dart' 'tool/*.dart' \
            | xargs -0 --no-run-if-empty dart format > /dev/null
          git diff
      - name: Analiz (bilgi düzeyi dahil hata)
        run: flutter analyze --fatal-infos

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bağımlılıklar (pubspec.lock'a birebir)
        run: flutter pub get --enforce-lockfile
      - name: Çeviri kodu (gen_l10n)
        run: flutter gen-l10n
      - name: flutter test
        run: flutter test --reporter github

  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bağımlılıklar (pubspec.lock'a birebir)
        run: flutter pub get --enforce-lockfile
      - name: Uygulama sürümü (pubspec.yaml)
        # ADR-0012 §1.3: sürüm --dart-define=TAYFAM_SURUM ile verilir.
        run: |
          set -euo pipefail
          surum=$(sed -n 's/^version: *//p' pubspec.yaml)
          [[ "$surum" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]
          echo "TAYFAM_SURUM=$surum" >> "$GITHUB_ENV"
      - name: Geliştirme imza anahtarı (secret varsa)
        # ADR-0012 §6: Google girişi imza parmak izine bağlı olduğu için
        # geliştirme APK'sı sabit geliştirme anahtarıyla imzalanır. Anahtar
        # yalnızca GitHub secret'ıdır; geçici dizine açılır, iş sonunda
        # silinir. Secret yoksa (fork PR'ı) varsayılan debug anahtarı.
        env:
          ANAHTAR_B64: ${{ secrets.ANDROID_DEV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANAHTAR_B64" ]; then
            echo "Geliştirme anahtarı secret'ı yok; varsayılan debug anahtarı kullanılacak."
            exit 0
          fi
          dosya="$RUNNER_TEMP/tayfam-gelistirme.jks"
          printf '%s' "$ANAHTAR_B64" | base64 -d > "$dosya"
          chmod 600 "$dosya"
          echo "TAYFAM_DEV_KEYSTORE=$dosya" >> "$GITHUB_ENV"
      - name: Android debug derlemesi
        env:
          TAYFAM_DEV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          TAYFAM_DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          TAYFAM_DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: flutter build apk --debug --dart-define=TAYFAM_SURUM="$TAYFAM_SURUM"
      - name: Geliştirme anahtarını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/tayfam-gelistirme.jks"
      - name: Debug APK (artefakt)
        # Telefonda Google girişini denemek için; 14 gün saklanır.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tayfam-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Ana manifestte yalnızca INTERNET izni
        # Birleştirilmiş sürüm manifesti değil, ana manifest denetlenir;
        # eklenti paketlerinin getirdiği izinler ayrıca incelenir.
        run: |
          izinler=$(grep -o 'android:name="android.permission[^"]*"' android/app/src/main/AndroidManifest.xml | sort -u)
          echo "$izinler"
          test "$izinler" = 'android:name="android.permission.INTERNET"'

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bağımlılıklar (pubspec.lock'a birebir)
        run: flutter pub get --enforce-lockfile
      # Yalnızca geliştirme derlemesinin bozulmadığını görmek için; çıktı
      # yayınlanmaz ve artifact olarak yüklenmez (ADR-0011).
      - name: Web derlemesi (yayınlanmaz)
        run: |
          set -euo pipefail
          surum=$(sed -n 's/^version: *//p' pubspec.yaml)
          flutter build web --dart-define=TAYFAM_SURUM="$surum"

  kilit:
    name: kilit
    # pubspec.lock pubspec.yaml ile uyuşuyor mu (CLAUDE.md kesin kural 8).
    # Uyuşmuyorsa `flutter pub get` çalıştırılır ve pubspec.lock farkı
    # `git apply` ile birebir uygulanabilir yama olarak basılır; iş kırılır.
    # Bu iş dala yazmaz. Diğer işler --enforce-lockfile ile çalışır.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: pubspec.lock güncel mi
        run: |
          if flutter pub get --enforce-lockfile; then
            echo "pubspec.lock güncel."
            exit 0
          fi
          flutter pub get
          git diff --stat -- pubspec.lock
          echo "----- BEGIN LOCK PATCH (gzip+base64) -----"
          git diff --binary -- pubspec.lock | gzip -9n | base64 -w 76
          echo "----- END LOCK PATCH -----"
          echo "::error::pubspec.lock pubspec.yaml ile uyuşmuyor; yamayı uygulayıp commit et."
          exit 1

  api-kodu:
    name: api-kodu
    # ADR-0005: lib/core/api/gen/ sözleşmeden üretilir ve commit edilir.
    # Üretici SOURCE'taki commit'le yeniden çalıştırılır; repodakiyle fark
    # varsa iş başarısız olur. Bu iş dala yazmaz.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bağımlılıklar (pubspec.lock'a birebir)
        run: flutter pub get --enforce-lockfile
      - name: Sözleşme (SOURCE'taki commit)
        run: |
          set -euo pipefail
          kaynak=lib/core/api/gen/SOURCE
          repo=$(sed -n 's/^repo: //p' "$kaynak")
          commit=$(sed -n 's/^commit: //p' "$kaynak")
          yol=$(sed -n 's/^path: //p' "$kaynak")
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$yol" =~ ^[A-Za-z0-9_./-]+$ && "$yol" != *..* ]]
          hedef="$RUNNER_TEMP/sozlesme"
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$repo.git" "$hedef"
          git -C "$hedef" checkout --quiet "$commit" -- "$yol"
          echo "SPEC=$hedef/$yol" >> "$GITHUB_ENV"
      - name: Üretici
        run: dart run tool/openapi_gen/bin/openapi_gen.dart --spec "$SPEC" --out lib/core/api/gen
      - name: Üretilen kod güncel mi
        run: |
          git add --intent-to-add lib/core/api/gen
          if git diff --quiet -- lib/core/api/gen; then
            echo "Üretilen kod güncel."
            exit 0
          fi
          git diff --stat -- lib/core/api/gen
          git diff -- lib/core/api/gen
          # Aynı fark, `git apply` ile birebir uygulanabilir biçimde.
          echo "----- BEGIN GEN PATCH (gzip+base64) -----"
          git diff --binary -- lib/core/api/gen | gzip -9n | base64 -w 76
          echo "----- END GEN PATCH -----"
          echo "::error::lib/core/api/gen sözleşmeden üretilenle aynı değil; üreticiyi çalıştırıp sonucu commit et."
          exit 1

  gizli-bilgi:
    name: gizli-bilgi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks, PR'daki commit'leri listelemek için
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kurallar:
    name: kurallar
    # CLAUDE.md ve ADR kuralları (ADR-0009 zorunlu kontrol 4): import
    # sınırları, sabit renk/boşluk/yarıçap, sabit metin, log, diske yazma…
    # Kural listesi: dart run tool/kurallar/bin/kurallar.dart --liste
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bağımlılıklar (pubspec.lock'a birebir)
        run: flutter pub get --enforce-lockfile
      - name: Kural betiği
        run: dart run tool/kurallar/bin/kurallar.dart

  bagimliliklar:
    name: bagimliliklar
    # Bağımlılık ve lisans raporu (ADR-0009 zorunlu kontrol 5). PR'da taban
    # dalın, main'e push'ta bir önceki commit'in pubspec.lock'uyla
    # karşılaştırır; rapor iş özetine yazılır, PR'a yorum yazılmaz. İzin
    # verici olmayan lisans uyarıdır; iş yalnızca dosyalar okunamazsa kırılır.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bağımlılıklar (pubspec.lock'a birebir)
        run: flutter pub get --enforce-lockfile
      - name: Önceki pubspec.lock
        env:
          TABAN_DAL: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          onceki="$RUNNER_TEMP/onceki.lock"
          if [ -n "$TABAN_DAL" ]; then
            kaynak="origin/$TABAN_DAL"
          else
            kaynak="HEAD^"
          fi
          # Önceki sürümde kilit yoksa boş dosya: bütün paketler "eklendi".
          git show "$kaynak:pubspec.lock" > "$onceki" 2>/dev/null || : > "$onceki"
          echo "ONCEKI_KILIT=$onceki" >> "$GITHUB_ENV"
      - name: Bağımlılık ve lisans raporu
        run: dart run tool/kurallar/bin/bagimlilik_raporu.dart --onceki "$ONCEKI_KILIT" --sonraki pubspec.lock

