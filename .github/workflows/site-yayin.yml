name: Site yayını

# tayfam.app'i main'den Cloudflare Pages'e yayınlar — ADR-0013 §5–6,
# issue #25. Yalnızca main'e push'ta (site/** değişince) ya da elle
# (workflow_dispatch, yalnızca main'de) çalışır. PR'lardan yayın ya da
# önizleme yoktur. Yayından önce CI'daki site denetimi aynen çalışır.
#
# Token yalnızca `cloudflare-pages` GitHub ortamının secret'ıdır
# (CLOUDFLARE_API_TOKEN; "Account → Cloudflare Pages → Edit"). Hesap
# kimliği ve proje adı ortam değişkenidir. Ortam yalnızca main'e açıktır.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

# Yayınlar sırayla gider; yarıda kesilmez.
concurrency:
  group: site-yayin
  cancel-in-progress: false

jobs:
  denetim:
    name: denetim
    uses: ./.github/workflows/site-denetimi.yml

  yayin:
    name: yayin
    needs: denetim
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ortam değişkenleri tanımlı ve biçimi doğru
        env:
          HESAP: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJE: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          [[ "$HESAP" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID tanımlı değil ya da 32 haneli hex değil."; exit 1; }
          [[ "$PROJE" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]] || { echo "::error::CLOUDFLARE_PAGES_PROJECT tanımlı değil ya da geçersiz."; exit 1; }
      - name: Cloudflare Pages'e yayın
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler sürümü de sabit (2026-10-20).
          wranglerVersion: '4.151.3'
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
