# Tek seferlik: bu oturumun ortamı pub.dev ve Flutter SDK'ya erişemediği için
# `flutter create` çıktısı ve pubspec.lock burada üretilip dala commit edilir.
# Çalıştıktan sonra kendi commit'inde silinir (tayfam-app #4, #9).
name: bootstrap
on:
  push:
    branches: [feat/proje-iskeleti]
    paths: [.github/workflows/bootstrap.yml]
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: flutter create
        run: flutter create --org app --project-name tayfam --platforms android,ios,web --empty --no-pub .
      - name: Bağımlılıklar (ADR-0001, 0003, 0005, 0007, 0008)
        run: |
          flutter pub add flutter_riverpod go_router http flutter_secure_storage web_socket_channel intl 'flutter_localizations:{"sdk":"flutter"}'
          flutter pub add --dev yaml
          flutter pub get
          flutter --version > tool/FLUTTER_VERSION.txt 2>&1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/bootstrap.yml
          git add -A
          git status --short
          git commit -q -m "chore: flutter create çıktısı ve pubspec.lock (otomatik, bootstrap)"
          git push
