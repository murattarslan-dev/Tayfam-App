name: tayfam
description: "Tayfam: kulüp ve etkinlik uygulaması (Android, iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  # Etkinlik buluşma noktası: OpenStreetMap karolarıyla harita önizlemesi ve
  # seçici (ADR-0015 §4); yayıncı fleaflet.dev, izin gerektirmez, saf
  # Flutter (Android/iOS). Yerleşik karo önbelleği kapalı kullanılır
  # (ADR-0006).
  flutter_map: ^8.2.2
  # Push bildirimleri (istemci ADR-0019; Tayfam-Api ADR-0019): FCM. Yayıncı
  # firebase.google.com (FlutterFire, Google). Yalnızca firebase_core ve
  # firebase_messaging; Analytics/Crashlytics yok, otomatik veri toplama
  # manifestte kapalı. Android'de POST_NOTIFICATIONS, WAKE_LOCK,
  # ACCESS_NETWORK_STATE ve c2dm RECEIVE izinlerini getirir. 17.x'in
  # registration token API'leri deprecated olduğu için 16.7 hattı.
  firebase_core: ^4.15.1
  firebase_messaging: ^16.7.1
  # Fotoğrafı cihazda çözme (HEIC dahil), EXIF yönünü uygulama, küçültme ve
  # JPEG kodlama (ADR-0021 §2): platform kodlayıcıları (Android Bitmap,
  # iOS UIImage/ImageIO). Yayıncı fluttercandies.com, MIT; izin eklemez.
  # Metadata silmenin garantisi bu paket değil lib/core/medya/jpeg.dart.
  flutter_image_compress: ^2.4.0
  flutter_secure_storage: ^11.2.0
  # Varış bildirimi ("Geldim", ADR-0015 §5): düğmeye basınca "uygulamayı
  # kullanırken" izniyle tek seferlik konum (getCurrentPosition). Konum
  # akışı, arka plan konumu ve son bilinen konum kullanılmaz. Yayıncı
  # baseflow.com; Android'de ACCESS_FINE/COARSE_LOCATION.
  geolocator: ^14.1.2
  go_router: ^18.1.4
  # Google ile giriş (ADR-0012 §2); yayıncı flutter.dev.
  google_sign_in: ^7.2.0
  http: ^1.6.0
  # QR ile cihaz eşleştirmede kamera önizlemesi ve görüntü akışı (ADR-0020
  # §7); yayıncı flutter.dev, BSD-3. Android CameraX, iOS AVFoundation. İzin:
  # CAMERA (yalnızca "Cihaz bağla" ekranında istenir); paketin getirdiği
  # RECORD_AUDIO ve WRITE_EXTERNAL_STORAGE manifestte kaldırılır.
  camera: ^0.12.1
  # Galeriden ya da kameradan tek fotoğraf (ADR-0021 §1); yayıncı
  # flutter.dev, BSD-3. Android'de Photo Picker (izinsiz), kamera sistem
  # uygulamasıyla (CAMERA izni gerekmez); iOS'ta PHPicker. Android
  # uygulaması ve arayüzü yalnızca Photo Picker'ı açmak için doğrudan
  # bağımlılıktır (aynı yayıncı).
  image_picker: ^1.2.0
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.0
  # İlk etkinlikten sonra mağazanın uygulama içi değerlendirme penceresi
  # (ADR-0016 §4): Android'de Play In-App Review, iOS'ta
  # SKStoreReviewController. Yalnızca isAvailable() ve requestReview();
  # mağaza sayfası açılmaz. Kaynak github.com/britannio/in_app_review;
  # izin gerektirmez.
  in_app_review: ^2.0.12
  intl: ^0.20.3
  # flutter_map'in koordinat türü (ADR-0015 Sonuçlar); saf Dart, izin yok.
  latlong2: ^0.9.1
  # Eşleştirme QR'ını üretmek için (ADR-0020); çizim CustomPainter ile.
  # Yayıncı kevmoo.com (doğrulanmış), BSD-3, saf Dart, izin gerektirmez.
  # Sürüm tam sabit.
  qr: 4.0.1
  # Tayfa kodunu sistem paylaşım menüsüyle paylaşmak için (ADR-0014 §5);
  # yayıncı fluttercommunity.dev, izin gerektirmez.
  share_plus: ^13.3.1
  # Hukuki metinleri ve mağaza sayfasını sistem tarayıcısında açmak için
  # (ADR-0012 §1, §4); yayıncı flutter.dev.
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3
  # Kameradan gelen parlaklık düzleminde QR çözme (ADR-0020 §7): ZXing'in
  # saf Dart portu; yayıncı xaha.dev (doğrulanmış), BSD-3 (ZXing kaynağı
  # Apache-2.0). Yerel kod, ağ erişimi ve telemetri yok; izin gerektirmez.
  # Sürüm tam sabit.
  zxing2: 0.2.4

dev_dependencies:
  # QR tarayıcının testlerinde sahte kamera platformu (ADR-0020 §7);
  # yayıncı flutter.dev, BSD-3; camera'nın kendi bağımlılığı.
  camera_platform_interface: ^2.12.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  # gen_l10n: lib/l10n/app_tr.arb → AppLocalizations (ADR-0008, l10n.yaml)
  generate: true
  # Google'ın resmi "G" işareti (ADR-0012 §2; kaynak: assets/marka/KAYNAK.md).
  # 2.0x/ ve 3.0x/ çözünürlükleri Flutter kendisi seçer.
  assets:
    - assets/marka/google_g.png
  # Gömülü font (ADR-0004 §1): Bricolage Grotesque, SIL OFL 1.1
  # (assets/fonts/OFL.txt). google/fonts reposundaki değişken fonttan
  # tool/font/bricolage_ornekle.py ile üretilen statik örnekler; yalnızca
  # kullanılan ağırlıklar. 800 yuvası büyük başlığın wght 750 örneğidir.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-Baslik750.ttf
          weight: 800
