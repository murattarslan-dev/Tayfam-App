publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  # gen_l10n: lib/l10n/app_tr.arb → AppLocalizations (ADR-0008, l10n.yaml)
  generate: true
