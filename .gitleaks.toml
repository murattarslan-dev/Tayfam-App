# gitleaks yapılandırması: varsayılan kurallar + daraltılmış istisnalar.
# Commit'e bağlı tek tek istisnalar .gitleaksignore'dadır.

[extend]
useDefault = true

# Firebase Android ve iOS yapılandırması (istemci ADR-0019 §1 ve iOS
# notu): içindeki "AIza…" API anahtarı her APK'da ve IPA'da açıkça bulunan, public bir istemci
# tanımlayıcısıdır (kesin kural 6); gizli değildir. İstisna yalnızca bu
# iki dosya yolu içindir. (CI'daki gitleaks 8.24 kurala özgü global
# istisnayı — [[allowlists]] targetRules — desteklemediği için yol
# düzeyinde.)
[allowlist]
description = "Firebase google-services.json ve GoogleService-Info.plist (public istemci yapılandırması)"
paths = [
  '''^android/app/google-services\.json$''',
  '''^ios/Runner/GoogleService-Info\.plist$''',
]
